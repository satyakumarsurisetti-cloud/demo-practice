name: CI
on:
  push:
    branches:
      - main

jobs:
  prebuild:
    name: setup required libraries
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

  build:
    name: building application
    runs-on: ubuntu-latest
    needs: prebuild
    
    steps:
      - name: Install dependencies
        run: |
             sudo apt update
             sudo apt install python3 -y
